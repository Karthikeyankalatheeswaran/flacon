# Packaging config. Secrets never live here: signing/notarisation credentials come from the environment (see docs/packaging.md).
appId: app.flacon.player
productName: Flacon
copyright: Copyright © Flacon contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # The GPL dev-only ffmpeg must never ship: only the bundled LGPL build in extraResources may.
  - "!node_modules/ffmpeg-static/**"
  - "!**/*.map"
asar: true
afterPack: build/afterPack.cjs
# Bundled LGPL ffmpeg + libsoxr for the target platform (build with scripts/build-ffmpeg.sh). ffmpeg-static is dev-only.
# Native/binary assets must live outside the asar: the OS loads .node files and spawns ffmpeg from real paths.
asarUnpack:
  - "**/*.node"
# better-sqlite3 >= 13 ships N-API prebuilds for all platforms (ABI-stable), so nothing is rebuilt at package time.
npmRebuild: false
extraMetadata:
  main: out/main/index.js
fileAssociations:
  - { ext: flac, name: FLAC audio, role: Viewer }
  - { ext: wav, name: WAV audio, role: Viewer }
  - { ext: aiff, name: AIFF audio, role: Viewer }
  - { ext: m4a, name: M4A audio, role: Viewer }
  - { ext: mp3, name: MP3 audio, role: Viewer }
  - { ext: ogg, name: Ogg audio, role: Viewer }
  - { ext: opus, name: Opus audio, role: Viewer }
  - { ext: dsf, name: DSD audio, role: Viewer }
mac:
  icon: build/icon.icns
  files:
    - "!**/better-sqlite3/prebuilds/{linux,win32}*.node"
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  extraResources:
    - { from: "vendor/ffmpeg/darwin-${arch}", to: ffmpeg }
  category: public.app-category.music
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSHumanReadableCopyright: Flacon
    # Audio playback only: no microphone/camera. The app never records.
    LSUIElement: false
  # identity / notarize are supplied by CI (-c.mac.identity, -c.mac.notarize=true); unsigned local builds just skip them.
win:
  icon: build/icon.ico
  files:
    - "!**/better-sqlite3/prebuilds/{linux,darwin}*.node"
  # Editing the exe (icon/version) normally needs wine off Windows; build/afterPack.cjs does it in pure JS instead.
  signAndEditExecutable: false
  extraResources:
    - { from: "vendor/ffmpeg/win32-${arch}", to: ffmpeg }
  target:
    - { target: nsis, arch: [x64, arm64] }
nsis:
  buildUniversalInstaller: false
  artifactName: "${productName}-${version}-win-${arch}-setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
